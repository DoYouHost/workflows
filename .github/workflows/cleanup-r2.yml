name: Cleanup old files from Cloudflare R2

on:
  workflow_call:
    inputs:
      directory:
        description: Directory to clean up
        required: true
        type: string
      days_old:
        description: Delete files older than this many days
        required: false
        type: string
        default: '30'
    secrets:
      CF_ACCOUNT_ID:
        required: true
      CF_ACCESS_KEY_ID:
        required: true
      CF_SECRET_ACCESS_KEY:
        required: true
      CF_BUCKET_NAME:
        required: true

jobs:
  cleanup:
    name: Cleanup old files
    runs-on: self-hosted
    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq unzip curl

      - name: Check and install AWS CLI
        run: |
          # Check if AWS CLI is already installed
          if command -v aws &> /dev/null; then
            echo "✅ AWS CLI is already installed"
            aws --version
          else
            echo "📦 AWS CLI not found, installing..."
            
            # Download and install AWS CLI v2
            curl "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "awscliv2.zip"
            unzip awscliv2.zip
            sudo ./aws/install --update
            rm -rf aws awscliv2.zip
            
            # Verify installation
            echo "✅ AWS CLI installed successfully"
            aws --version
          fi

      - name: Configure AWS CLI for R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.CF_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CF_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_ENDPOINT_URL_S3: https://${{ secrets.CF_ACCOUNT_ID }}.r2.cloudflarestorage.com
        run: |
          aws configure set aws_access_key_id $AWS_ACCESS_KEY_ID
          aws configure set aws_secret_access_key $AWS_SECRET_ACCESS_KEY
          aws configure set region $AWS_DEFAULT_REGION
          aws configure set endpoint_url $AWS_ENDPOINT_URL_S3

      - name: List and delete old files
        env:
          DIRECTORY: ${{ inputs.directory }}
          DAYS_OLD: ${{ inputs.days_old || '30' }}
          AWS_ACCESS_KEY_ID: ${{ secrets.CF_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CF_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_ENDPOINT_URL_S3: https://${{ secrets.CF_ACCOUNT_ID }}.r2.cloudflarestorage.com
          BUCKET_NAME: ${{ secrets.CF_BUCKET_NAME }}
        run: |
          set +e  # Disable exit on error to handle failures gracefully
          
          # Calculate cutoff date
          CUTOFF_DATE=$(date -d "$DAYS_OLD days ago" +%Y-%m-%d)

          echo "🧹 Starting cleanup process"
          echo "📁 Directory: $DIRECTORY"
          echo "⏰ Days old threshold: $DAYS_OLD"
          echo "📅 Cutoff date: $CUTOFF_DATE"
          echo "🔗 Called by: ${{ github.event.workflow_run.name || github.workflow_ref }}"

          # Create temp directory for manifests
          mkdir -p /tmp/manifests

          # Download manifest files (suppress output to avoid exposing bucket name)
          if aws s3 cp s3://$BUCKET_NAME/$DIRECTORY/manifest.json /tmp/manifests/manifest.json --quiet 2>/dev/null; then
            echo "📋 Found manifest.json"
          else
            echo "ℹ️ manifest.json not found"
          fi

          if aws s3 cp s3://$BUCKET_NAME/$DIRECTORY/manifest-beta.json /tmp/manifests/manifest-beta.json --quiet 2>/dev/null; then
            echo "📋 Found manifest-beta.json"
          else
            echo "ℹ️ manifest-beta.json not found"
          fi

          # Extract file paths and versions from manifests
          PROTECTED_FILES=""
          PROTECTED_VERSIONS=""

          # Always protect manifest files
          PROTECTED_FILES="manifest.json manifest-beta.json"

          for manifest in /tmp/manifests/manifest.json /tmp/manifests/manifest-beta.json; do
            if [ -f "$manifest" ]; then
              echo "📋 Processing $manifest"

              # Extract version from manifest
              MANIFEST_VERSION=$(jq -r '.version' "$manifest" 2>/dev/null || echo "")
              if [ -n "$MANIFEST_VERSION" ]; then
                PROTECTED_VERSIONS="$PROTECTED_VERSIONS $MANIFEST_VERSION"
              fi

              # Extract OTA paths
              OTA_PATHS=$(jq -r '.builds[].ota.path' "$manifest" 2>/dev/null || echo "")
              if [ -n "$OTA_PATHS" ]; then
                PROTECTED_FILES="$PROTECTED_FILES $OTA_PATHS"
              fi

              # Extract parts paths
              PARTS_PATHS=$(jq -r '.builds[].parts[].path' "$manifest" 2>/dev/null || echo "")
              if [ -n "$PARTS_PATHS" ]; then
                PROTECTED_FILES="$PROTECTED_FILES $PARTS_PATHS"
              fi
            fi
          done

          # Remove duplicates
          PROTECTED_FILES=$(echo "$PROTECTED_FILES" | tr ' ' '\n' | sort | uniq | tr '\n' ' ')
          PROTECTED_VERSIONS=$(echo "$PROTECTED_VERSIONS" | tr ' ' '\n' | sort | uniq | tr '\n' ' ')

          echo "🛡️ Protected files (will not be deleted):"
          echo "$PROTECTED_FILES"
          echo "📁 Protected versions (directories will be skipped):"
          echo "$PROTECTED_VERSIONS"

          # List all objects in the directory (with error handling)
          ALL_OBJECTS=$(aws s3api list-objects-v2 --bucket "$BUCKET_NAME" --prefix "$DIRECTORY/" --query 'Contents[].Key' --output text 2>/dev/null)
          if [ $? -ne 0 ]; then
            echo "❌ Failed to list objects in directory: $DIRECTORY"
            exit 1
          fi

          # Filter objects by age and exclude protected files
          OBJECTS_TO_DELETE=""

          for obj in $ALL_OBJECTS; do
            # Get the relative path within the directory
            REL_PATH="${obj#${DIRECTORY}/}"

            # Skip manifest files in root directory
            if [[ "$REL_PATH" == "manifest.json" || "$REL_PATH" == "manifest-beta.json" ]]; then
              echo "🛡️ Skipping protected manifest file: $obj"
              continue
            fi

            # Skip if file is in protected list
            if echo "$PROTECTED_FILES" | grep -q "^${REL_PATH}$"; then
              echo "🛡️ Skipping protected file: $obj"
              continue
            fi

            # Check if this object is inside a protected version directory
            OBJECT_DIR=$(dirname "$REL_PATH")
            if [ "$OBJECT_DIR" != "." ]; then
              # Check if the directory name matches any protected version
              SKIP_FILE=false
              for version in $PROTECTED_VERSIONS; do
                if [[ "$OBJECT_DIR" == "$version" || "$OBJECT_DIR" == "$version/" ]]; then
                  echo "🛡️ Skipping file in protected version directory: $obj (version: $version)"
                  SKIP_FILE=true
                  break
                fi
              done
              if [ "$SKIP_FILE" = true ]; then
                continue
              fi
            fi

            # Check if file is older than cutoff date (with error handling)
            OBJ_DATE=$(aws s3api head-object --bucket "$BUCKET_NAME" --key "$obj" --query 'LastModified' --output text 2>/dev/null | cut -d'T' -f1)
            if [ $? -ne 0 ] || [ -z "$OBJ_DATE" ]; then
              echo "⚠️ Could not get date for: ${obj#${DIRECTORY}/}"
              continue
            fi

            if [[ "$OBJ_DATE" < "$CUTOFF_DATE" ]]; then
              OBJECTS_TO_DELETE="$OBJECTS_TO_DELETE $obj"
            fi
          done

          if [ -n "$OBJECTS_TO_DELETE" ]; then
            OBJECT_COUNT=$(echo "$OBJECTS_TO_DELETE" | wc -w)
            echo "🗑️ Found $OBJECT_COUNT old files to delete"

            # Initialize counters
            DELETED_COUNT=0
            FAILED_COUNT=0

            echo "🔄 Starting deletion process..."

            # Delete objects one by one with better error handling
            for obj in $OBJECTS_TO_DELETE; do
              if [ -n "$obj" ]; then
                echo "🗑️ Deleting: ${obj#${DIRECTORY}/}"
                if aws s3 rm "s3://$BUCKET_NAME/$obj" --quiet; then
                  ((DELETED_COUNT++))
                  echo "  ✅ Successfully deleted"
                else
                  echo "  ❌ Failed to delete: ${obj#${DIRECTORY}/}"
                  ((FAILED_COUNT++))
                fi
                
                # Add small delay to avoid overwhelming the API
                sleep 0.1
              fi
            done

            echo ""
            echo "📊 Deletion summary:"
            echo "  ✅ Successfully deleted: $DELETED_COUNT files"
            echo "  ❌ Failed to delete: $FAILED_COUNT files"
            echo "  📋 Total processed: $((DELETED_COUNT + FAILED_COUNT)) files"

            if [ $FAILED_COUNT -gt 0 ]; then
              echo ""
              echo "⚠️ Some files could not be deleted. This might be due to:"
              echo "  - Permission issues"
              echo "  - Network connectivity problems"
              echo "  - Files being modified during deletion"
              echo "  - API rate limiting"
              echo ""
              echo "🔄 Cleanup completed with $FAILED_COUNT failures out of $OBJECT_COUNT files"
            else
              echo ""
              echo "✅ Cleanup completed successfully - all $DELETED_COUNT files deleted"
            fi
            
            # Exit with success even if some files failed to delete
            # Only exit with error if no files were deleted at all
            if [ $DELETED_COUNT -eq 0 ] && [ $FAILED_COUNT -gt 0 ]; then
              echo "❌ No files were successfully deleted"
              exit 1
            fi
          else
            echo "ℹ️ No old files found to delete"
          fi